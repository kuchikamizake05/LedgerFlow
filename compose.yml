services:
  db:
    image: postgres:17-alpine
    container_name: ledgerflow-db
    environment:
      POSTGRES_DB: ledgerflow
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow_local_dev
    ports:
      - "5432:5432"
    volumes:
      - ledgerflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ledgerflow-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ledgerflow
      SPRING_DATASOURCE_USERNAME: ledgerflow
      SPRING_DATASOURCE_PASSWORD: ledgerflow_local_dev
      SERVER_PORT: 8081
    ports:
      - "8081:8081"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ledgerflow-web
    depends_on:
      - api
    environment:
      PORT: 3000
      NODE_ENV: production
      LEDGERFLOW_API_URL: http://api:8081
    ports:
      - "3000:3000"

volumes:
  ledgerflow_postgres_data:
