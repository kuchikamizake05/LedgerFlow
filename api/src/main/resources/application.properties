spring.application.name=ledgerflow-api
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/ledgerflow
spring.datasource.username=ledgerflow
spring.datasource.password=ledgerflow_local_dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Override this value through LEDGERFLOW_JWT_SECRET outside local development.
ledgerflow.jwt.secret=${LEDGERFLOW_JWT_SECRET:local-development-secret-must-be-at-least-32-bytes}
ledgerflow.jwt.ttl=30m

# Optional first-start administrator provisioning. Both values must be supplied together.
ledgerflow.bootstrap-admin.email=${LEDGERFLOW_BOOTSTRAP_ADMIN_EMAIL:}
ledgerflow.bootstrap-admin.password=${LEDGERFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
