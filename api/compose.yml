services:
  db:
    image: postgres:17-alpine
    container_name: ledgerflow-db
    environment:
      POSTGRES_DB: ledgerflow
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow_local_dev
    ports:
      - "5432:5432"
    volumes:
      - ledgerflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledgerflow_postgres_data: